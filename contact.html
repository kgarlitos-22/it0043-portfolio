<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="js/theme-init.js"></script>
    <script src="js/script.js" defer></script>
    <title>Contact</title>
</head>
<body>
    <header>
        <article class="sheene-card">Contact Information</article>

        <button id="menu-button">☰</button>
        <button id="theme-button" type="button">🌙 Dark Mode</button>
        <nav id="main-nav">
            <a href="index.html">HOME</a>
            <a href="about.html">ABOUT</a>
            <a href="skills.html">SKILLS</a>
            <a href="contact.html">CONTACT</a>
            
        </nav>
    </header>

    <main>
        <article class="card">
            <h2>Contact Me</h2>

            <form id="contact-form" novalidate>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
                <p id="name-error" class="error-message"></p>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <p id="email-error" class="error-message"></p>

                <label for="message">Message:</label>
                <textarea id="message" name="message"></textarea>
                <p id="message-error" class="error-message"></p>

                <button type="submit">Submit</button>

                <p id="success-message"></p>
            </form>
        </article>
    </main>

    <footer>
        <p>&copy; 2026 My Portfolio</p>
    </footer>
</body>
</html>
